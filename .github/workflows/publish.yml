name: Publish npm package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install -g npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run release:check
      - name: Pack verified release
        run: npm pack
      - name: Publish through npm trusted publishing
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            NPM_TAG=next
          else
            NPM_TAG=latest
          fi
          npm publish "apple-design-skill-${PACKAGE_VERSION}.tgz" --access public --provenance --tag "$NPM_TAG"
